# 1. Bloque para redirigir de HTTP a HTTPS automáticamente
server {
    listen 80;
    server_name localhost;

    # Si alguien entra por http://localhost, lo mandamos a https://localhost
    return 301 https://$host$request_uri;
}

# 2. Bloque principal para HTTPS
server {
    listen 443 ssl;
    server_name localhost;

    # Configuración de los certificados (Rutas dentro del contenedor Docker)
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Optimización de SSL (Opcional pero recomendado)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Mantenemos tu LÍNEA MÁGICA para React:
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}