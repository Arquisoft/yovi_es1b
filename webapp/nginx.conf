# En caso de recargar la página, si no encuentra un archivo, siempre devuelva el index.html para que React se encargue del resto.
server {
    listen 80;

    # En MPA, cada .html debe existir físicamente. Si no existe, devolver 404.
    location ~* \.html$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}