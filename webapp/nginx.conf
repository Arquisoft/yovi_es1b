# En caso de recargar la página, si no encuentra un archivo, siempre devuelva el index.html para que React se encargue del resto.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # ESTA ES LA LÍNEA MÁGICA:
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}