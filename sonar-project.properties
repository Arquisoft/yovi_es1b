sonar.organization=arquisoft
sonar.host.url=https://sonarcloud.io
sonar.projectKey=Arquisoft_yovi_es1b
sonar.projectName=yovi_es1b

# Mantenemos las fuentes
sonar.sources=webapp/src,users,gamey/src

# Excluimos tests Y TAMBIÉN assets/binarios que bloquean el análisis
sonar.exclusions=webapp/src/__tests__/**, users/__tests__/**, webapp/src/assets/**, **/*.png, **/*.jpg, **/*.mp3

sonar.tests=webapp/src/__tests__,users/__tests__,gamey/src
sonar.test.inclusions=**/*.test.tsx,**/*.test.ts,**/*.test.js
sonar.javascript.lcov.reportPaths=webapp/coverage/lcov.info,users/coverage/lcov.info
sonar.rust.lcov.reportPaths=gamey/lcov.info