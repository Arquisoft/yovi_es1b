version: "3.8"

services:
  users:
    build: ./users
    container_name: users
    image: ghcr.io/arquisoft/yovi_es1b-users:latest
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - GAMEY_SERVICE_URL=http://gamey:3000
    networks:
      - monitor-net

  webapp:
    build:
      context: ./webapp
      args:
        - VITE_API_URL=${PUBLIC_API_URL}
        - VITE_GAMEY_URL=http://localhost:4000
    container_name: webapp
    image: ghcr.io/arquisoft/yovi_es1b-webapp:latest
    ports:
      - "80:80"
    depends_on:
      - users
      - gamey
    networks:
      - monitor-net

  gamey:
    build: ./gamey
    container_name: gamey
    image: ghcr.io/arquisoft/yovi_es1b-gamey:latest
    ports:
      - "4000:3000"
    command: ["./gamey", "--mode", "server", "--port", "3000"]
    environment:
      - MONGODB_URI=${MONGODB_URI}
    networks:
      - monitor-net

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./users/monitoring/prometheus:/etc/prometheus
    networks:
      - monitor-net

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "9091:3000"
    volumes:
      - ./users/monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitor-net

networks:
  monitor-net:
    driver: bridge
